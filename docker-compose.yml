# Ciudadan AgentOffice — reproducible single-service deployment.
# One office per developer; up to seven real Cline agents.
# No Ollama, no Redis. Restart policy = the process supervisor.
services:
  agentoffice:
    build: .
    image: ciudadan/agentoffice:latest
    container_name: agentoffice
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Local-only by default; use a private proxy (Tailscale/CF
      # Access) for remote access — never expose directly.
      HOST: "127.0.0.1"
      PORT: "3000"
      # Read-only observation of the host's Cline data (mounted below).
      CLINE_DATA_DIR: "/host-cline-data"
      # Hub control requires the host's Cline SDK + hub record; leave
      # dispatch disabled in containers (observation-only) unless you
      # also mount the SDK path and hub record read-only.
      INSTRUCTION_DISPATCH_ENABLED: "false"
    ports:
      - "127.0.0.1:${PORT:-3000}:3000"
    volumes:
      # Persistence: office DB, task proposals, audit, hub workspaces.
      - office-data:/app/packages/server/data
      # Read-only view of the developer's Cline data (observation).
      - ${CLINE_DATA_DIR:-/workspace/.cline/data}:/host-cline-data:ro
volumes:
  office-data:

